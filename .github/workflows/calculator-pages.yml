name: Deploy calculator and slider to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'kalkulator/**'
      - 'slider-3d/**'
      - '.github/workflows/calculator-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: calculator-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages content
        run: |
          mkdir -p "$RUNNER_TEMP/pages/slider-3d"
          cp -a kalkulator/. "$RUNNER_TEMP/pages/"
          cp -a slider-3d/. "$RUNNER_TEMP/pages/slider-3d/"
      - name: Upload Pages content
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
